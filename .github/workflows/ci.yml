name: CI

# Runs the full test suite on every push and pull request, so a change that
# breaks escrow, the fraud shield or the review gate is caught before it is
# merged rather than after someone has paid money.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version developed against, plus the current LTS.
        node: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # mongodb-memory-server downloads a ~100MB mongod binary on first run.
      # Caching it turns a slow minute into a few seconds on every later build.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Server tests
        run: npm test
        working-directory: server
        env:
          # A throwaway secret so JWT signing works. The suite also deletes the
          # mail and CAPTCHA keys in tests/setup.js, so CI can never send an
          # email or call Cloudflare.
          JWT_SECRET: ci-test-secret-not-used-anywhere-real
          NODE_ENV: test

      - name: Client tests
        run: npm test
        working-directory: client

      # A green test suite that doesn't compile helps nobody.
      - name: Client production build
        run: npm run build
        working-directory: client

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # Advisory only for now — the existing code has warnings that aren't
      # worth blocking a build over, but new errors should be visible.
      - run: npx eslint . --max-warnings=-1
        working-directory: client
        continue-on-error: true
